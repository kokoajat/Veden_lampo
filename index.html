<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYKE Veden Lämpötila - Tilastot ja Kaaviot v4</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f8; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { font-size: 1.5rem; color: #0056b3; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], input[type="date"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { background-color: #0056b3; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; font-size: 1rem; }
        .btn:hover { background-color: #004494; }
        .flex-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .flex-row > div { flex: 1; }
        #chartContainer { margin-top: 30px; position: relative; height: 400px; width: 100%; }
        #loading { display: none; color: #0056b3; font-weight: bold; margin-top: 10px; }
        .error { color: red; margin-top: 10px; font-weight: bold; word-break: break-all; }
        .debug { font-size: 0.8rem; color: #666; margin-top: 10px; background: #eee; padding: 10px; border-radius: 4px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Vesistöjen pintaveden lämpötilat (SYKE Avoin Data)</h1>

    <div class="form-group">
        <label for="stationSearch">1. Etsi mittausasema (esim. "Inari" tai "Nellim")</label>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="stationSearch" placeholder="Syötä aseman nimi..." value="Nellim">
            <button class="btn" onclick="searchStations()">Etsi asemat</button>
        </div>
    </div>

    <div class="form-group">
        <label for="stationSelect">Valitse asema</label>
        <select id="stationSelect">
            <option value="">Etsi ensin asemia yllä olevalla kentällä...</option>
        </select>
    </div>

    <div class="flex-row">
        <div>
            <label for="startDate">2. Alkamispäivä</label>
            <input type="date" id="startDate" value="2024-05-01">
        </div>
        <div>
            <label for="endDate">3. Päättymispäivä</label>
            <input type="date" id="endDate" value="2026-08-07">
        </div>
    </div>

    <button class="btn" onclick="fetchDataAndDrawChart()">Hae havainnot ja piirrä kaavio</button>
    <div id="loading">Haetaan dataa, odota hetki...</div>
    <div id="errorMsg" class="error"></div>
    <div id="debugInfo" class="debug"></div>

    <div id="chartContainer">
        <canvas id="tempChart"></canvas>
    </div>
</div>

<script>
    let myChart = null;

    async function searchStations() {
        const searchTerm = document.getElementById('stationSearch').value.trim().toLowerCase();
        if (!searchTerm) {
            alert('Syötä hakusana');
            return;
        }

        const select = document.getElementById('stationSelect');
        const errorMsg = document.getElementById('errorMsg');
        select.innerHTML = '<option>Haetaan...</option>';
        errorMsg.textContent = '';
        
        const targetUrl = `https://rajapinnat.ymparisto.fi/api/Hydrologiarajapinta/1.0/odata/Paikka?$filter=substringof('${searchTerm}', tolower(Nimi))`;
        const proxyUrl = `https://api.allorigins.win/raw?url=` + encodeURIComponent(targetUrl);

        try {
            const response = await fetch(proxyUrl);
            if (!response.ok) throw new Error(`HTTP virhe: ${response.status}`);
            
            const data = await response.json();
            const stations = data.value;

            select.innerHTML = '';
            if (stations.length === 0) {
                select.innerHTML = '<option value="">Ei löytynyt asemia tällä hakusanalla</option>';
            } else {
                stations.forEach(station => {
                    const option = document.createElement('option');
                    option.value = station.Paikka_Id;
                    option.text = `${station.Nimi} (ID: ${station.Paikka_Id})`;
                    select.appendChild(option);
                });
            }
        } catch (error) {
            select.innerHTML = '<option value="">Virhe asemien haussa</option>';
            errorMsg.textContent = 'Virhe asemien haussa: ' + error.message;
        }
    }

    async function fetchDataAndDrawChart() {
        const paikkaId = document.getElementById('stationSelect').value;
        const startDate = document.getElementById('startDate').value;
        const endDate = document.getElementById('endDate').value;
        const errorMsg = document.getElementById('errorMsg');
        const debugInfo = document.getElementById('debugInfo');
        const loading = document.getElementById('loading');

        errorMsg.textContent = '';
        debugInfo.style.display = 'none';

        if (!paikkaId) {
            errorMsg.textContent = 'Valitse ensin mittausasema.';
            return;
        }

        loading.style.display = 'block';

        const targetUrl = `https://rajapinnat.ymparisto.fi/api/Hydrologiarajapinta/1.0/odata/VedenLampotila?$filter=Paikka_Id eq ${paikkaId} and Aika ge datetime'${startDate}T00:00:00' and Aika le datetime'${endDate}T23:59:59'&$orderby=Aika asc`;
        const proxyUrl = `https://api.allorigins.win/raw?url=` + encodeURIComponent(targetUrl);

        try {
            const response = await fetch(proxyUrl);
            if (!response.ok) {
                throw new Error(`API palautti virheen: ${response.status} ${response.statusText}`);
            }
            
            const data = await response.json();
            const observations = data.value;

            if (!observations || observations.length === 0) {
                errorMsg.textContent = 'Valitulta aikaväliltä ei löytynyt lämpötilahavaintoja tälle asemalle.';
                loading.style.display = 'none';
                return;
            }

            const labels = observations.map(obs => new Date(obs.Aika).toLocaleDateString('fi-FI'));
            const values = observations.map(obs => obs.Arvo);

            drawChart(labels, values, document.getElementById('stationSelect').options[document.getElementById('stationSelect').selectedIndex].text);

        } catch (error) {
            errorMsg.innerHTML = `Latausvirhe: ${error.message}`;
            debugInfo.style.display = 'block';
            debugInfo.textContent = "Kohde-URL: " + targetUrl;
        } finally {
            loading.style.display = 'none';
        }
    }

    function drawChart(labels, data, stationName) {
        const ctx = document.getElementById('tempChart').getContext('2d');
        if (myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: `Lämpötila (°C) - ${stationName}`,
                    data: data,
                    borderColor: 'rgba(54, 162, 235, 1)',
                    backgroundColor: 'rgba(54, 162, 235, 0.2)',
                    borderWidth: 2, pointRadius: 1, fill: true, tension: 0.1
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    window.onload = searchStations;
</script>

</body>
</html>
