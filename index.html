<!DOCTYPE html>
<html lang="fi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SYKE Pintaveden lämpötilat v15</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
    background:#edf2f7;
    color:#222;
}

.container{

    max-width:1100px;
    margin:auto;

    background:#fff;

    border-radius:12px;

    box-shadow:0 5px 15px rgba(0,0,0,.15);

    padding:25px;

}

h1{

    margin-top:0;

    color:#0056b3;

    text-align:center;

}

.form-group{

    margin-bottom:15px;

}

label{

    display:block;

    margin-bottom:5px;

    font-weight:bold;

}

input,
select{

    width:100%;

    padding:10px;

    border:1px solid #ccc;

    border-radius:6px;

    font-size:15px;

}

button{

    background:#0056b3;

    color:white;

    border:none;

    padding:10px 18px;

    border-radius:6px;

    cursor:pointer;

    font-size:15px;

}

button:hover{

    background:#003f86;

}

button:disabled{

    background:#9ab4d1;

    cursor:not-allowed;

}

.row{

    display:flex;

    gap:15px;

    flex-wrap:wrap;

}

.col{

    flex:1;

    min-width:250px;

}

.toolbar{

    margin-top:20px;

    display:flex;

    gap:10px;

    flex-wrap:wrap;

}

.stats{

    margin-top:20px;

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(170px,1fr));

    gap:10px;

}

.card{

    background:#f5f8fc;

    border-radius:8px;

    padding:12px;

    text-align:center;

}

.card h3{

    margin:0;

    font-size:14px;

    color:#777;

}

.card p{

    margin:8px 0 0;

    font-size:22px;

    font-weight:bold;

    color:#0056b3;

}

#chartContainer{

    margin-top:25px;

    height:500px;

}

#error{

    color:red;

    font-weight:bold;

    margin-top:10px;

}

#loading{

    display:none;

    margin-top:10px;

    color:#0056b3;

    font-weight:bold;

}

footer{

    margin-top:30px;

    text-align:center;

    color:#888;

    font-size:13px;

}

@media(max-width:700px){

.row{

display:block;

}

.col{

margin-bottom:12px;

}

.toolbar{

display:grid;

grid-template-columns:1fr 1fr;

}

}

</style>

</head>

<body>

<div class="container">

<h1>SYKE Pintaveden lämpötilat v15</h1>

<div class="form-group">

<label>Mittausasema</label>

<div class="row">

<div class="col">

<input
id="stationSearch"
type="text"
placeholder="Kirjoita esim. Nellim">

</div>

<div style="width:130px">

<button
id="searchButton">

Etsi

</button>

</div>

</div>

</div>

<div class="form-group">

<select id="stationSelect">

<option>Kirjoita hakusana ja paina Etsi</option>

</select>

</div>

<div class="row">

<div class="col">

<label>Alkupäivä</label>

<input
type="date"
id="startDate"
value="2024-05-01">

</div>

<div class="col">

<label>Loppupäivä</label>

<input
type="date"
id="endDate">

</div>

</div>

<div class="toolbar">

<button id="loadButton">

Hae lämpötilat

</button>

<button id="savePNG">

Tallenna PNG

</button>

<button id="exportCSV">

Vie CSV

</button>

<button id="refresh">

Päivitä

</button>

</div>

<div id="loading">

Haetaan tietoja...

</div>

<div id="error"></div>

<div class="stats">

<div class="card">

<h3>Mittauksia</h3>

<p id="countStat">-</p>

</div>

<div class="card">

<h3>Minimi</h3>

<p id="minStat">-</p>

</div>

<div class="card">

<h3>Maksimi</h3>

<p id="maxStat">-</p>

</div>

<div class="card">

<h3>Keskiarvo</h3>

<p id="avgStat">-</p>

</div>

<div class="card">

<h3>Viimeisin</h3>

<p id="lastStat">-</p>

</div>

</div>

<div id="chartContainer">

<canvas id="tempChart"></canvas>

</div>

<footer>

Hydrologiarajapinta 1.2 • Chart.js • v15 (korjattu)

</footer>

</div>

<script>

const API_BASE =
"https://rajapinnat.ymparisto.fi/api/Hydrologiarajapinta/1.2/odata";

let chart = null;

// Nykyisen kuvaajan data talteen CSV-vientiä varten
let currentLabels = [];
let currentValues = [];

document.getElementById("endDate").value =
new Date().toISOString().substring(0,10);

// ------------------------------
// Elementtiviittaukset
// ------------------------------

const stationSearch = document.getElementById("stationSearch");
const stationSelect = document.getElementById("stationSelect");

const loadButton = document.getElementById("loadButton");
const searchButton = document.getElementById("searchButton");
const savePNGButton = document.getElementById("savePNG");
const refreshButton = document.getElementById("refresh");
const exportCSVButton = document.getElementById("exportCSV");

const loading = document.getElementById("loading");
const error = document.getElementById("error");

// ------------------------------
// Aputoiminnot
// ------------------------------

function showLoading(text = "Haetaan tietoja...") {

    loading.style.display = "block";
    loading.textContent = text;

}

function hideLoading() {

    loading.style.display = "none";

}

function showError(msg) {

    error.textContent = msg;

}

function clearError() {

    error.textContent = "";

}

// ------------------------------
// Asemien haku
// ------------------------------

async function searchStations() {

    clearError();

    const term = stationSearch.value.trim();

    if (term.length < 2) {

        showError("Kirjoita vähintään kaksi kirjainta.");

        return;

    }

    showLoading("Haetaan asemia...");
    searchButton.disabled = true;

    try {

        const params = new URLSearchParams();

        // Huom: haku pienillä kirjaimilla, jotta täsmää tolower(Nimi):iin
        params.set(
            "$filter",
            `substringof('${term.toLowerCase()}',tolower(Nimi))`
        );

        params.set("$orderby","Nimi");

        const url =
            `${API_BASE}/Paikka?${params.toString()}`;

        console.log(url);

        const response = await fetch(url,{
            headers:{
                "Accept":"application/json"
            }
        });

        if(!response.ok){

            throw new Error(
                "HTTP "+response.status
            );

        }

        const json = await response.json();

        stationSelect.innerHTML = "";

        if(json.value.length===0){

            stationSelect.innerHTML =
            "<option>Ei asemia</option>";

            hideLoading();
            searchButton.disabled = false;

            return;

        }

        json.value.forEach(station=>{

            const option =
            document.createElement("option");

            option.value =
            station.Paikka_Id;

            option.textContent =
            `${station.Nimi} (${station.Paikka_Id})`;

            stationSelect.appendChild(option);

        });

    }

    catch(err){

        showError("Asemien haku epäonnistui: " + err.message);

    }

    hideLoading();
    searchButton.disabled = false;

}

searchButton.addEventListener("click", searchStations);

// Mahdollistaa haun myös Enter-näppäimellä
stationSearch.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        e.preventDefault();
        searchStations();
    }
});

// ------------------------------
// Lämpötilojen haku
// ------------------------------

loadButton.addEventListener("click", loadTemperatures);
refreshButton.addEventListener("click", loadTemperatures);

async function loadTemperatures() {

    clearError();

    const paikkaId = stationSelect.value;

    if (!paikkaId || isNaN(Number(paikkaId))) {
        showError("Valitse ensin asema hakutuloksista.");
        return;
    }

    showLoading("Haetaan lämpötiloja...");
    loadButton.disabled = true;

    try {

        const start =
            document.getElementById("startDate").value;

        const end =
            document.getElementById("endDate").value;

        if (!start || !end) {
            throw new Error("Valitse alku- ja loppupäivä.");
        }

        const params = new URLSearchParams();

        params.set(
            "$filter",
            `Paikka_Id eq ${paikkaId} and Aika ge datetime'${start}T00:00:00' and Aika le datetime'${end}T23:59:59'`
        );

        params.set("$orderby","Aika asc");

        const url =
            `${API_BASE}/LampoPintavesi?${params.toString()}`;

        console.log(url);

        const response = await fetch(url,{
            headers:{
                "Accept":"application/json"
            }
        });

        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }

        const json =
            await response.json();

        if(!json.value.length){

            throw new Error(
                "Mittauksia ei löytynyt valitulla aikavälillä."
            );

        }

        const labels = [];
        const values = [];

        json.value.forEach(r=>{

            labels.push(
                new Date(r.Aika)
                .toLocaleDateString("fi-FI")
            );

            values.push(
                Number(r.Arvo)
            );

        });

        // Talteen CSV-vientiä varten
        currentLabels = labels;
        currentValues = values;

        updateStatistics(values);

        drawChart(labels,values);

    }

    catch(err){

        showError(err.message);

    }

    hideLoading();
    loadButton.disabled = false;

}

// ----------------------------------------------------
// Tilastojen laskenta
// ----------------------------------------------------

function updateStatistics(values) {

    if (!values || values.length === 0) return;

    const count = values.length;

    const min = Math.min(...values);

    const max = Math.max(...values);

    const avg =
        values.reduce((a,b)=>a+b,0) / count;

    const sorted =
        [...values].sort((a,b)=>a-b);

    const median =
        sorted.length % 2 === 0
        ?
        (
            sorted[sorted.length/2-1]
            +
            sorted[sorted.length/2]
        ) / 2
        :
        sorted[Math.floor(sorted.length/2)];

    document.getElementById("countStat").textContent =
        count;

    document.getElementById("minStat").textContent =
        min.toFixed(1) + " °C";

    document.getElementById("maxStat").textContent =
        max.toFixed(1) + " °C";

    document.getElementById("avgStat").textContent =
        avg.toFixed(1) + " °C";

    document.getElementById("lastStat").textContent =
        values[values.length-1].toFixed(1) + " °C";

    console.log({
        count,
        min,
        max,
        avg,
        median
    });

}

// ----------------------------------------------------
// Kaavion piirto
// ----------------------------------------------------

function drawChart(labels, values) {

    const ctx = document.getElementById("tempChart").getContext("2d");

    if (chart) {
        chart.destroy();
    }

    chart = new Chart(ctx, {
        type: "line",
        data: {
            labels: labels,
            datasets: [{
                label: "Pintaveden lämpötila (°C)",
                data: values,
                borderColor: "#0056b3",
                backgroundColor: "rgba(0,86,179,0.1)",
                fill: true,
                tension: 0.2,
                pointRadius: 2
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    title: {
                        display: true,
                        text: "°C"
                    }
                },
                x: {
                    title: {
                        display: true,
                        text: "Päivämäärä"
                    }
                }
            },
            plugins: {
                legend: {
                    display: true
                }
            }
        }
    });

}

// ----------------------------------------------------
// PNG-tallennus
// ----------------------------------------------------

savePNGButton.addEventListener("click", () => {

    if (!chart) {
        alert("Ei kaaviota tallennettavaksi. Hae ensin lämpötiloja.");
        return;
    }

    const link = document.createElement("a");
    link.href = chart.toBase64Image();
    link.download = "veden_lampotilat.png";
    link.click();

});

// ----------------------------------------------------
// CSV-vienti
// ----------------------------------------------------

exportCSVButton.addEventListener("click", exportCSV);

function exportCSV(){

    if(currentValues.length===0){

        alert("Ei vietävää dataa. Hae ensin lämpötiloja.");

        return;

    }

    let csv="Päivämäärä;Lämpötila\n";

    for(let i=0;i<currentValues.length;i++){

        csv+=
        currentLabels[i] +
        ";" +
        currentValues[i] +
        "\n";

    }

    const blob=
    new Blob(
        [csv],
        {
            type:"text/csv;charset=utf-8;"
        }
    );

    const url=
    URL.createObjectURL(blob);

    const a=
    document.createElement("a");

    a.href=url;

    a.download="veden_lampotilat.csv";

    a.click();

    URL.revokeObjectURL(url);

}

</script>

</body>

</html>
