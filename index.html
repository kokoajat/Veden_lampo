<script>

const API_BASE =
"https://rajapinnat.ymparisto.fi/api/Hydrologiarajapinta/1.2/odata";

let chart = null;

// Nykyisen kuvaajan data talteen CSV-vientiä varten
let currentLabels = [];
let currentValues = [];

// Viimeisimmän asemahaun tulokset talteen (Paikka_Id + Nimi),
// jotta voimme kokeilla saman nimisiä "sisaraseamia" jos valitulla
// asemalla ei ole pintaveden lämpötiladataa (SYKE rekisteröi saman
// paikan usealla eri Paikka_Id:llä, yksi per mittaussuure).
let lastStationResults = [];

// Ollaanko vuosivertailu-tilassa (vaikuttaa CSV-vientiin)
let comparisonMode = false;
let comparisonExportData = null; // { labels: [...], years: [{year, values:[...]}] }

document.getElementById("endDate").value =
new Date().toISOString().substring(0,10);

// ------------------------------
// Elementtiviittaukset
// ------------------------------

const stationSearch = document.getElementById("stationSearch");
const stationSelect = document.getElementById("stationSelect");

const loadButton = document.getElementById("loadButton");
const searchButton = document.getElementById("searchButton");
const savePNGButton = document.getElementById("savePNG");
const refreshButton = document.getElementById("refresh");
const exportCSVButton = document.getElementById("exportCSV");
const compareYearsButton = document.getElementById("compareYearsButton");
const yearsInput = document.getElementById("yearsInput");
const cmpStartDay = document.getElementById("cmpStartDay");
const cmpStartMonth = document.getElementById("cmpStartMonth");
const cmpEndDay = document.getElementById("cmpEndDay");
const cmpEndMonth = document.getElementById("cmpEndMonth");
const onlyTempStations = document.getElementById("onlyTempStations");
const listAllButton = document.getElementById("listAllButton");
const stationSummary = document.getElementById("stationSummary");

// Koko lämpötila-asemalista muistetaan, jotta uusi klikkaus on välitön
let allTempStationsCache = null;

// Varmistettu lämpötilasuureen tunnus muistetaan istunnon ajaksi
let tempSuureId = null;

const loading = document.getElementById("loading");
const error = document.getElementById("error");

// ------------------------------
// Aputoiminnot
// ------------------------------

function showLoading(text = "Haetaan tietoja...") {

    loading.style.display = "block";
    loading.textContent = text;

}

function hideLoading() {

    loading.style.display = "none";

}

function showError(msg) {

    error.textContent = msg;

}

function clearError() {

    error.textContent = "";

}

// ------------------------------
// Asemien haku
// ------------------------------

// Tarkistaa onko asemalla lainkaan pintaveden lämpötiladataa kysymällä
// sitä suoraan LampoPintavesi-taulusta. Tämä on luotettavampi kuin
// metatietoon (Suure_Id) luottaminen, koska se testaa itse datan
// olemassaolon. Palauttaa viimeisimmän mittauspäivän tai null.
async function probeStation(paikkaId) {

    const params = new URLSearchParams();

    params.set("$filter", `Paikka_Id eq ${paikkaId}`);
    params.set("$orderby", "Aika desc");
    params.set("$top", "1");

    const url = `${API_BASE}/LampoPintavesi?${params.toString()}`;

    try {

        const response = await fetch(url, {
            headers: { "Accept": "application/json" }
        });

        if (!response.ok) return null;

        const json = await response.json();

        if (!json.value || !json.value.length) return null;

        return new Date(json.value[0].Aika);

    }

    catch (err) {
        console.warn("Aseman " + paikkaId + " tarkistus epäonnistui:", err.message);
        return null;
    }

}

// Kuinka montaa asemaa korkeintaan tarkistetaan (suojaa laajaa hakua vastaan)
const MAX_PROBE = 30;

async function searchStations() {

    clearError();
    stationSummary.textContent = "";

    const term = stationSearch.value.trim();

    if (term.length < 2) {

        showError("Kirjoita vähintään kaksi kirjainta.");

        return;

    }

    showLoading("Haetaan asemia...");
    searchButton.disabled = true;

    try {

        const params = new URLSearchParams();

        // Huom: haku pienillä kirjaimilla, jotta täsmää tolower(Nimi):iin
        params.set(
            "$filter",
            `substringof('${term.toLowerCase()}',tolower(Nimi))`
        );

        params.set("$orderby","Nimi");

        const url =
            `${API_BASE}/Paikka?${params.toString()}`;

        console.log(url);

        const response = await fetch(url,{
            headers:{
                "Accept":"application/json"
            }
        });

        if(!response.ok){

            throw new Error(
                "HTTP "+response.status
            );

        }

        const json = await response.json();

        stationSelect.innerHTML = "";
        lastStationResults = [];

        if(json.value.length===0){

            stationSelect.innerHTML =
            "<option>Ei asemia</option>";

            showError(`Hakusanalla "${term}" ei löytynyt asemia.`);

            hideLoading();
            searchButton.disabled = false;

            return;

        }

        // Lista näytettävistä asemista: { Paikka_Id, Nimi, latest }
        let stations = [];
        let truncated = false;

        if (onlyTempStations.checked) {

            let candidates = json.value;

            if (candidates.length > MAX_PROBE) {
                candidates = candidates.slice(0, MAX_PROBE);
                truncated = true;
            }

            showLoading(`Tarkistetaan lämpötiladata (${candidates.length} asemaa)...`);

            // Tarkistukset rinnakkain, jotta odotus pysyy lyhyenä
            const probes = await Promise.all(
                candidates.map(s => probeStation(s.Paikka_Id))
            );

            candidates.forEach((s, i) => {
                if (probes[i] !== null) {
                    stations.push({
                        Paikka_Id: s.Paikka_Id,
                        Nimi: s.Nimi,
                        latest: probes[i]
                    });
                }
            });

        }

        else {

            stations = json.value.map(s => ({
                Paikka_Id: s.Paikka_Id,
                Nimi: s.Nimi,
                latest: null
            }));

        }

        if (stations.length === 0) {

            stationSelect.innerHTML =
            "<option>Ei lämpötila-asemia</option>";

            showError(
                `Hakusanalla "${term}" löytyi ${json.value.length} asemaa, mutta yhdelläkään ei ole pintaveden lämpötiladataa. Poista rasti ruudusta nähdäksesi kaikki asemat.`
            );

            hideLoading();
            searchButton.disabled = false;

            return;

        }

        // Sama järjestys kuin koko listassa: aktiiviset ensin
        // aakkosjärjestyksessä, sitten vanhentuneet.
        if (onlyTempStations.checked) {

            const thisYear = new Date().getFullYear();
            const collator = new Intl.Collator("fi");

            stations.sort((a,b) => {

                const aActive = a.latest.getFullYear() >= thisYear - 1;
                const bActive = b.latest.getFullYear() >= thisYear - 1;

                if (aActive !== bActive) return aActive ? -1 : 1;

                const byName = collator.compare(a.Nimi, b.Nimi);

                if (byName !== 0) return byName;

                return b.latest - a.latest;

            });

        }

        else {

            stations.sort((a,b) =>
                new Intl.Collator("fi").compare(a.Nimi, b.Nimi)
            );

        }

        stations.forEach(s => {

            const option = document.createElement("option");

            option.value = s.Paikka_Id;

            option.textContent = s.latest
                ? `${s.Nimi} (${s.Paikka_Id}) – dataa ${s.latest.getFullYear()} asti`
                : `${s.Nimi} (${s.Paikka_Id})`;

            stationSelect.appendChild(option);

            lastStationResults.push({
                Paikka_Id: s.Paikka_Id,
                Nimi: s.Nimi,
                latest: s.latest
            });

        });

        if (truncated) {
            showError(
                `Huom: tarkistettiin vain ${MAX_PROBE} ensimmäistä asemaa. Tarkenna hakusanaa nähdäksesi loput.`
            );
        }

    }

    catch(err){

        showError("Asemien haku epäonnistui: " + err.message);

    }

    hideLoading();
    searchButton.disabled = false;

}

// Haetaan asemat uudelleen kun suodatusvalinta muuttuu
onlyTempStations.addEventListener("change", () => {
    if (stationSearch.value.trim().length >= 2) {
        searchStations();
    }
});

searchButton.addEventListener("click", searchStations);

// Mahdollistaa haun myös Enter-näppäimellä
stationSearch.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        e.preventDefault();
        searchStations();
    }
});

// ------------------------------
// Kaikkien lämpötila-asemien listaus
// ------------------------------

// Suorittaa asynkronisen operaation listalle rajoitetulla
// rinnakkaisuudella, jottei selain avaa kymmeniä yhteyksiä kerralla.
async function mapWithLimit(items, limit, fn, onProgress) {

    const results = new Array(items.length);

    let nextIndex = 0;
    let completed = 0;

    async function worker() {

        while (true) {

            const i = nextIndex++;

            if (i >= items.length) return;

            results[i] = await fn(items[i]);

            completed++;

            if (onProgress) onProgress(completed, items.length);

        }

    }

    const workers = [];

    for (let w = 0; w < Math.min(limit, items.length); w++) {
        workers.push(worker());
    }

    await Promise.all(workers);

    return results;

}

// Lämpötilasuureen tunnuksen selvittäminen.
//
// Rajapinnassa jokainen Paikka-rivi kuuluu yhdelle mittaussuureelle
// (Suure_Id). Emme voi luottaa siihen, että Suure-taulun kenttien
// arvot ovat juuri odotetussa muodossa, joten tunnus varmistetaan
// aina kokeellisesti: haetaan muutama asema ja katsotaan löytyykö
// niiltä oikeasti dataa LampoPintavesi-taulusta.

// Hakee asemat, joilla on annettu Suure_Id. limit rajaa otoskoon.
async function fetchStationsBySuure(suureId, limit) {

    const params = new URLSearchParams();

    params.set("$filter", `Suure_Id eq ${suureId}`);

    if (limit) params.set("$top", String(limit));

    const urls = [
        `${API_BASE}/Paikka?${params.toString()}`,
        `${API_BASE}/Suure(${suureId})/Paikka`
    ];

    for (const url of urls) {

        try {

            const response = await fetch(url, {
                headers: { "Accept": "application/json" }
            });

            if (!response.ok) continue;

            const json = await response.json();

            if (json.value && json.value.length) {
                return json.value;
            }

        }

        catch (err) {
            console.warn("Kysely epäonnistui:", url, err.message);
        }

    }

    return null;

}

// Testaa onko annettu Suure_Id pintaveden lämpötila: haetaan otos
// asemia ja tarkistetaan löytyykö niiltä lämpötiladataa.
async function verifySuureId(suureId) {

    const sample = await fetchStationsBySuure(suureId, 5);

    if (!sample) return false;

    for (const s of sample) {
        if (await probeStation(s.Paikka_Id)) {
            return true;
        }
    }

    return false;

}

// Yrittää lukea tunnuksen Suure-taulusta. Käytetään vain
// arvausjärjestyksen parantamiseen - tulos varmistetaan silti.
async function guessSuureIdFromTable() {

    try {

        const response = await fetch(`${API_BASE}/Suure`, {
            headers: { "Accept": "application/json" }
        });

        if (!response.ok) return null;

        const json = await response.json();

        if (!json.value) return null;

        // Tulostetaan taulu konsoliin vianetsintää varten
        console.log("Suure-taulu:", json.value.map(s =>
            `${s.Suure_Id}: ${s.Nimi} / ${s.Suurekoodi} / ${s.DatataulunNimi}`
        ));

        const norm = v =>
            String(v || "").toLowerCase().replace(/[^a-zåäö]/g, "");

        const match = json.value.find(s =>
            norm(s.DatataulunNimi) === "lampopintavesi" ||
            norm(s.taulunnimi) === "lampopintavesi" ||
            norm(s.Nimi).includes("pintavedenlampotila") ||
            norm(s.NimiEng).includes("surfacewatertemperature")
        );

        return match ? match.Suure_Id : null;

    }

    catch (err) {
        console.warn("Suure-taulun haku epäonnistui:", err.message);
        return null;
    }

}

// Selvittää lämpötilasuureen tunnuksen ja varmistaa sen.
async function getTempSuureId(onProgress) {

    if (tempSuureId !== null) return tempSuureId;

    // Arvaus taulusta ensin, sitten muut tunnukset järjestyksessä
    const guess = await guessSuureIdFromTable();

    const order = [];

    if (guess !== null) order.push(guess);

    for (let n = 1; n <= 20; n++) {
        if (n !== guess) order.push(n);
    }

    for (let i = 0; i < order.length; i++) {

        const id = order[i];

        if (onProgress) onProgress(i + 1, order.length, id);

        if (await verifySuureId(id)) {
            tempSuureId = id;
            console.log("Pintaveden lämpötilan Suure_Id varmistettu:", id);
            return id;
        }

    }

    return null;

}

listAllButton.addEventListener("click", listAllTempStations);

async function listAllTempStations() {

    clearError();
    stationSummary.textContent = "";

    // Käytä välimuistia jos lista on jo haettu
    if (allTempStationsCache) {
        populateStationList(allTempStationsCache, true);
        return;
    }

    listAllButton.disabled = true;
    searchButton.disabled = true;

    try {

        showLoading("Tunnistetaan lämpötilasuuretta...");

        const suureId = await getTempSuureId((done, total, id) => {
            showLoading(`Tunnistetaan lämpötilasuuretta... (kokeillaan ${id})`);
        });

        if (suureId === null) {
            throw new Error(
                "Lämpötilasuureen tunnistus epäonnistui kaikilla tunnuksilla. " +
                "Nimihaku toimii silti. Konsolista (F12) näet Suure-taulun sisällön."
            );
        }

        showLoading("Haetaan asemalistaa...");

        const candidates = await fetchStationsBySuure(suureId, null);

        if (!candidates) {
            throw new Error(
                "Asemalistan haku epäonnistui. Käytä nimihakua."
            );
        }

        showLoading(`Tarkistetaan ${candidates.length} aseman data...`);

        // Varmistetaan jokaiselta, että dataa todella on, ja
        // haetaan samalla viimeisin mittausvuosi.
        const probes = await mapWithLimit(
            candidates,
            6,
            s => probeStation(s.Paikka_Id),
            (done, total) => {
                showLoading(`Tarkistetaan asemia... ${done}/${total}`);
            }
        );

        const stations = [];

        candidates.forEach((s, i) => {
            if (probes[i] !== null) {
                stations.push({
                    Paikka_Id: s.Paikka_Id,
                    Nimi: s.Nimi,
                    latest: probes[i]
                });
            }
        });

        if (stations.length === 0) {
            throw new Error(
                `Löytyi ${candidates.length} rekisteröityä asemaa, mutta yhdeltäkään ei saatu lämpötiladataa.`
            );
        }

        allTempStationsCache = {
            stations: stations,
            registered: candidates.length
        };

        populateStationList(allTempStationsCache, false);

    }

    catch (err) {
        showError(err.message);
    }

    hideLoading();
    listAllButton.disabled = false;
    searchButton.disabled = false;

}

// Täyttää valikon asemalistalla ja näyttää yhteenvedon
function populateStationList(cache, fromCache) {

    const stations = [...cache.stations];

    // Aktiivisiksi lasketaan asemat, joilta on dataa kuluvalta tai
    // edelliseltä vuodelta
    const thisYear = new Date().getFullYear();

    const isActive = s => s.latest.getFullYear() >= thisYear - 1;

    // Järjestys: ensin aktiiviset aakkosjärjestyksessä,
    // sitten vanhentuneet aakkosjärjestyksessä.
    const collator = new Intl.Collator("fi");

    stations.sort((a,b) => {

        const aActive = isActive(a);
        const bActive = isActive(b);

        if (aActive !== bActive) {
            return aActive ? -1 : 1;
        }

        const byName = collator.compare(a.Nimi, b.Nimi);

        if (byName !== 0) return byName;

        // Sama nimi: tuorein ensin
        return b.latest - a.latest;

    });

    stationSelect.innerHTML = "";
    lastStationResults = [];

    const activeStations = stations.filter(isActive);
    const oldStations = stations.filter(s => !isActive(s));

    // Ryhmitellään valikossa, jotta jako näkyy selvästi
    function addGroup(label, list) {

        if (list.length === 0) return;

        const group = document.createElement("optgroup");

        group.label = label;

        list.forEach(s => {

            const option = document.createElement("option");

            option.value = s.Paikka_Id;

            option.textContent =
                `${s.Nimi} (${s.Paikka_Id}) – dataa ${s.latest.getFullYear()} asti`;

            group.appendChild(option);

            lastStationResults.push({
                Paikka_Id: s.Paikka_Id,
                Nimi: s.Nimi,
                latest: s.latest
            });

        });

        stationSelect.appendChild(group);

    }

    addGroup(`Aktiiviset (${activeStations.length})`, activeStations);
    addGroup(`Vanhentuneet (${oldStations.length})`, oldStations);

    stationSummary.textContent =
        `${stations.length} asemaa, joilla on lämpötiladataa ` +
        `(${activeStations.length} aktiivista, ${oldStations.length} vanhentunutta). ` +
        `Rekisteröityjä lämpötilapaikkoja ${cache.registered}.`;

    hideLoading();

}

loadButton.addEventListener("click", loadTemperatures);
refreshButton.addEventListener("click", loadTemperatures);

// Palauttaa listan kokeiltavista Paikka_Id:istä: ensin annettu asema,
// sitten muut samannimiset "sisaraseamat" viimeisimmästä hakutuloksesta.
function getStationCandidates(paikkaId) {

    const candidates = [paikkaId];

    const selectedStation =
        lastStationResults.find(s => String(s.Paikka_Id) === String(paikkaId));

    if (selectedStation) {

        lastStationResults.forEach(s => {
            if (s.Nimi === selectedStation.Nimi && String(s.Paikka_Id) !== String(paikkaId)) {
                candidates.push(s.Paikka_Id);
            }
        });

    }

    return candidates;

}

// Hakee LampoPintavesi-datan yhdelle Paikka_Id:lle.
// Palauttaa {labels, values, rawDates} tai null, jos mittauksia ei löytynyt.
// Heittää virheen vain HTTP-tason ongelmista (esim. verkkovirhe).
async function fetchTemperatureData(paikkaId, start, end) {

    const params = new URLSearchParams();

    params.set(
        "$filter",
        `Paikka_Id eq ${paikkaId} and Aika ge datetime'${start}T00:00:00' and Aika le datetime'${end}T23:59:59'`
    );

    params.set("$orderby","Aika asc");

    const url =
        `${API_BASE}/LampoPintavesi?${params.toString()}`;

    console.log(url);

    const response = await fetch(url,{
        headers:{
            "Accept":"application/json"
        }
    });

    if(!response.ok){
        throw new Error("HTTP " + response.status);
    }

    const json = await response.json();

    if(!json.value.length){
        return null;
    }

    const labels = [];
    const values = [];
    const rawDates = [];

    json.value.forEach(r=>{

        const d = new Date(r.Aika);

        rawDates.push(d);

        labels.push(
            d.toLocaleDateString("fi-FI")
        );

        values.push(
            Number(r.Arvo)
        );

    });

    return { labels, values, rawDates };

}

// Kokeilee annetun aseman ja sen sisaraseamien dataa annetulla
// aikavälillä, kunnes joltain löytyy mittauksia.
// Palauttaa {result, usedPaikkaId} tai null jos yhdeltäkään ei löytynyt.
async function fetchWithFallback(paikkaId, start, end, onTrySibling) {

    const candidates = getStationCandidates(paikkaId);

    for (const candidate of candidates) {

        if (String(candidate) !== String(paikkaId) && onTrySibling) {
            onTrySibling(candidate);
        }

        const result = await fetchTemperatureData(candidate, start, end);

        if (result) {
            return { result, usedPaikkaId: candidate };
        }

    }

    return null;

}

async function loadTemperatures() {

    clearError();

    const paikkaId = stationSelect.value;

    if (!paikkaId || isNaN(Number(paikkaId))) {
        showError("Valitse ensin asema hakutuloksista.");
        return;
    }

    showLoading("Haetaan lämpötiloja...");
    loadButton.disabled = true;
    comparisonMode = false;
    document.getElementById("yearStats").innerHTML = "";

    try {

        const start =
            document.getElementById("startDate").value;

        const end =
            document.getElementById("endDate").value;

        if (!start || !end) {
            throw new Error("Valitse alku- ja loppupäivä.");
        }

        const found = await fetchWithFallback(paikkaId, start, end, (candidate) => {
            showLoading(`Kokeillaan asemaa Paikka_Id ${candidate}...`);
        });

        if (!found) {
            throw new Error(
                "Mittauksia ei löytynyt valitulla aikavälillä yhdeltäkään samannimiseltä asemalta."
            );
        }

        const { result, usedPaikkaId } = found;

        // Jos päädyttiin toiseen asemaan kuin valikossa oli valittuna,
        // päivitä valikko ja kerro käyttäjälle mitä tehtiin.
        if (String(usedPaikkaId) !== String(paikkaId)) {
            stationSelect.value = usedPaikkaId;
            showError(
                `Huom: valitulla asemalla ei ollut lämpötiladataa. Näytetään tiedot asemalta Paikka_Id ${usedPaikkaId}.`
            );
        }

        // Talteen CSV-vientiä varten
        currentLabels = result.labels;
        currentValues = result.values;

        updateStatistics(result.values);

        drawChart(result.labels, result.values);

    }

    catch(err){

        showError(err.message);

    }

    hideLoading();
    loadButton.disabled = false;

}

compareYearsButton.addEventListener("click", compareYears);

yearsInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        e.preventDefault();
        compareYears();
    }
});

// Värit eri vuosille (kierrätetään jos vuosia on enemmän)
const YEAR_COLORS = [
    "#0056b3",
    "#e6194b",
    "#3cb44b",
    "#f58231",
    "#911eb4",
    "#008080",
    "#9a6324",
    "#000075"
];

// Tulkitsee vuosikentän: "22,23,24" tai "2022, 2023" tai "2022-2026"
function parseYears(text) {

    const years = [];

    text.split(/[,;\s]+/).forEach(part => {

        part = part.trim();

        if (!part) return;

        // Väli, esim. 2022-2026 tai 22-26
        const range = part.match(/^(\d{2,4})\s*[-–]\s*(\d{2,4})$/);

        if (range) {

            const from = normalizeYear(range[1]);
            const to = normalizeYear(range[2]);

            if (from !== null && to !== null && from <= to) {
                for (let y = from; y <= to; y++) {
                    years.push(y);
                }
            }

            return;

        }

        const y = normalizeYear(part);

        if (y !== null) {
            years.push(y);
        }

    });

    // Poista duplikaatit, järjestä nousevaan järjestykseen
    return [...new Set(years)].sort((a,b)=>a-b);

}

// "22" -> 2022, "2024" -> 2024
function normalizeYear(text) {

    if (!/^\d{2,4}$/.test(text)) return null;

    let y = parseInt(text, 10);

    if (text.length === 2) {
        y = 2000 + y;
    }

    if (y < 1900 || y > 2100) return null;

    return y;

}

const MONTH_NAMES = [
    "tammikuu","helmikuu","maaliskuu","huhtikuu","toukokuu","kesäkuu",
    "heinäkuu","elokuu","syyskuu","lokakuu","marraskuu","joulukuu"
];

// Täyttää päivä- ja kuukausivalitsimet
function initPeriodSelects() {

    [cmpStartDay, cmpEndDay].forEach(sel => {
        for (let d = 1; d <= 31; d++) {
            const o = document.createElement("option");
            o.value = String(d);
            o.textContent = String(d) + ".";
            sel.appendChild(o);
        }
    });

    [cmpStartMonth, cmpEndMonth].forEach(sel => {
        MONTH_NAMES.forEach((name, i) => {
            const o = document.createElement("option");
            o.value = String(i + 1);
            o.textContent = name;
            sel.appendChild(o);
        });
    });

    // Oletusjakso: avovesikausi 1.5. - 31.8.
    cmpStartDay.value = "1";
    cmpStartMonth.value = "5";
    cmpEndDay.value = "31";
    cmpEndMonth.value = "8";

}

initPeriodSelects();

function pad2(n) {
    return String(n).padStart(2, "0");
}

// Rakentaa päivämäärän vuodelle. Päivä rajataan kuukauden pituuteen,
// jotta esim. 31.4. tai 29.2. karkausvuoden ulkopuolella ei tuota
// virheellistä päivämäärää.
function dateForYear(year, month, day) {

    const lastDay = new Date(year, month, 0).getDate();

    return `${year}-${pad2(month)}-${pad2(Math.min(day, lastDay))}`;

}

// Jakson kuvaus tekstinä, esim. "1.5. – 31.8."
function periodLabel(startDay, startMonth, endDay, endMonth) {
    return `${startDay}.${startMonth}. – ${endDay}.${endMonth}.`;
}

async function compareYears() {

    clearError();
    document.getElementById("yearStats").innerHTML = "";

    const paikkaId = stationSelect.value;

    if (!paikkaId || isNaN(Number(paikkaId))) {
        showError("Valitse ensin asema hakutuloksista.");
        return;
    }

    const years = parseYears(yearsInput.value);

    if (years.length === 0) {
        showError("Anna vertailtavat vuodet, esim. 2022,2023,2024,2025,2026");
        return;
    }

    const startDay = Number(cmpStartDay.value);
    const startMonth = Number(cmpStartMonth.value);
    const endDay = Number(cmpEndDay.value);
    const endMonth = Number(cmpEndMonth.value);

    // Jakso ei saa mennä vuodenvaihteen yli, koska silloin eri vuosien
    // päivät eivät asetu vertailukelpoisesti päällekkäin.
    if (
        endMonth < startMonth ||
        (endMonth === startMonth && endDay < startDay)
    ) {
        showError(
            "Jakson on päätyttävä saman kalenterivuoden puolella kuin se alkaa. Vuodenvaihteen yli menevää jaksoa ei voi verrata."
        );
        return;
    }

    const label = periodLabel(startDay, startMonth, endDay, endMonth);

    compareYearsButton.disabled = true;
    loadButton.disabled = true;

    const yearData = [];
    const missingYears = [];

    try {

        for (const year of years) {

            showLoading(`Haetaan vuotta ${year}...`);

            const yStart = dateForYear(year, startMonth, startDay);
            const yEnd = dateForYear(year, endMonth, endDay);

            const found = await fetchWithFallback(paikkaId, yStart, yEnd);

            if (found) {

                yearData.push({
                    year: year,
                    result: found.result,
                    usedPaikkaId: found.usedPaikkaId
                });

            } else {
                missingYears.push(year);
            }

        }

        if (yearData.length === 0) {

            const station = lastStationResults.find(
                s => String(s.Paikka_Id) === String(paikkaId)
            );

            let hint = "";

            if (station && station.latest) {
                hint = ` Tällä asemalla on dataa ${station.latest.getFullYear()} asti – kokeile lähempänä olevia vuosia.`;
            }

            throw new Error(
                `Mittauksia ei löytynyt yhdeltäkään vuodelta (${years.join(", ")}) jaksolla ${label}.` + hint
            );
        }

        drawComparisonChart(yearData, label);
        renderYearStats(yearData);

        comparisonMode = true;

        if (missingYears.length > 0) {
            showError(
                `Huom: vuosilta ${missingYears.join(", ")} ei löytynyt mittauksia tällä ajanjaksolla.`
            );
        }

    }

    catch (err) {
        showError(err.message);
    }

    hideLoading();
    compareYearsButton.disabled = false;
    loadButton.disabled = false;

}

// Piirtää usean vuoden käyrät samaan kaavioon.
// X-akselina käytetään päivä.kuukausi -muotoa, jotta vuodet
// asettuvat päällekkäin vertailtaviksi.
function drawComparisonChart(yearData, periodText) {

    // Rakennetaan yhteinen x-akseli: kaikki jaksolla esiintyvät MM-DD
    const allMD = new Set();

    yearData.forEach(yd => {
        yd.result.rawDates.forEach(d => {
            const mm = String(d.getMonth()+1).padStart(2,"0");
            const dd = String(d.getDate()).padStart(2,"0");
            allMD.add(`${mm}-${dd}`);
        });
    });

    const sortedMD = [...allMD].sort();

    const labels = sortedMD.map(md => {
        const [mm, dd] = md.split("-");
        return `${dd}.${mm}.`;
    });

    const datasets = yearData.map((yd, i) => {

        // Kartta MM-DD -> arvo tälle vuodelle
        const byMD = {};

        yd.result.rawDates.forEach((d, idx) => {
            const mm = String(d.getMonth()+1).padStart(2,"0");
            const dd = String(d.getDate()).padStart(2,"0");
            byMD[`${mm}-${dd}`] = yd.result.values[idx];
        });

        const color = YEAR_COLORS[i % YEAR_COLORS.length];

        return {
            label: String(yd.year),
            data: sortedMD.map(md => md in byMD ? byMD[md] : null),
            borderColor: color,
            backgroundColor: color,
            fill: false,
            tension: 0.2,
            pointRadius: 1.5,
            spanGaps: true
        };

    });

    const ctx = document.getElementById("tempChart").getContext("2d");

    if (chart) {
        chart.destroy();
    }

    chart = new Chart(ctx, {
        type: "line",
        data: {
            labels: labels,
            datasets: datasets
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: {
                mode: "index",
                intersect: false
            },
            scales: {
                y: {
                    title: { display: true, text: "°C" }
                },
                x: {
                    title: { display: true, text: "Päivä" },
                    ticks: { maxTicksLimit: 15 }
                }
            },
            plugins: {
                legend: { display: true },
                title: {
                    display: true,
                    text: `Vuosivertailu ${periodText}`
                }
            }
        }
    });

    // Talteen CSV-vientiä varten
    comparisonExportData = {
        labels: labels,
        years: yearData.map(yd => {

            const byMD = {};

            yd.result.rawDates.forEach((d, idx) => {
                const mm = String(d.getMonth()+1).padStart(2,"0");
                const dd = String(d.getDate()).padStart(2,"0");
                byMD[`${mm}-${dd}`] = yd.result.values[idx];
            });

            return {
                year: yd.year,
                values: sortedMD.map(md => md in byMD ? byMD[md] : "")
            };

        })
    };

    // Nollaa yhden vuoden tilastokortit, koska ne eivät päde vertailuun
    ["countStat","minStat","maxStat","avgStat","lastStat"].forEach(id => {
        document.getElementById(id).textContent = "-";
    });

}

// Näyttää taulukon, jossa jokaisen vuoden tunnusluvut rinnakkain
function renderYearStats(yearData) {

    let html = `
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <thead>
        <tr style="background:#f5f8fc;">
          <th style="padding:8px;text-align:left;border-bottom:2px solid #ddd;">Vuosi</th>
          <th style="padding:8px;text-align:right;border-bottom:2px solid #ddd;">Mittauksia</th>
          <th style="padding:8px;text-align:right;border-bottom:2px solid #ddd;">Min</th>
          <th style="padding:8px;text-align:right;border-bottom:2px solid #ddd;">Max</th>
          <th style="padding:8px;text-align:right;border-bottom:2px solid #ddd;">Keskiarvo</th>
        </tr>
      </thead>
      <tbody>`;

    yearData.forEach((yd, i) => {

        const v = yd.result.values;
        const avg = v.reduce((a,b)=>a+b,0) / v.length;
        const color = YEAR_COLORS[i % YEAR_COLORS.length];

        html += `
        <tr>
          <td style="padding:8px;border-bottom:1px solid #eee;">
            <span style="display:inline-block;width:12px;height:12px;background:${color};border-radius:2px;margin-right:8px;"></span>
            <strong>${yd.year}</strong>
          </td>
          <td style="padding:8px;text-align:right;border-bottom:1px solid #eee;">${v.length}</td>
          <td style="padding:8px;text-align:right;border-bottom:1px solid #eee;">${Math.min(...v).toFixed(1)} °C</td>
          <td style="padding:8px;text-align:right;border-bottom:1px solid #eee;">${Math.max(...v).toFixed(1)} °C</td>
          <td style="padding:8px;text-align:right;border-bottom:1px solid #eee;"><strong>${avg.toFixed(1)} °C</strong></td>
        </tr>`;

    });

    html += `</tbody></table>`;

    document.getElementById("yearStats").innerHTML = html;

}

// ----------------------------------------------------
// Tilastojen laskenta
// ----------------------------------------------------

function updateStatistics(values) {

    if (!values || values.length === 0) return;

    const count = values.length;

    const min = Math.min(...values);

    const max = Math.max(...values);

    const avg =
        values.reduce((a,b)=>a+b,0) / count;

    const sorted =
        [...values].sort((a,b)=>a-b);

    const median =
        sorted.length % 2 === 0
        ?
        (
            sorted[sorted.length/2-1]
            +
            sorted[sorted.length/2]
        ) / 2
        :
        sorted[Math.floor(sorted.length/2)];

    document.getElementById("countStat").textContent =
        count;

    document.getElementById("minStat").textContent =
        min.toFixed(1) + " °C";

    document.getElementById("maxStat").textContent =
        max.toFixed(1) + " °C";

    document.getElementById("avgStat").textContent =
        avg.toFixed(1) + " °C";

    document.getElementById("lastStat").textContent =
        values[values.length-1].toFixed(1) + " °C";

    console.log({
        count,
        min,
        max,
        avg,
        median
    });

}

// ----------------------------------------------------
// Kaavion piirto
// ----------------------------------------------------

function drawChart(labels, values) {

    const ctx = document.getElementById("tempChart").getContext("2d");

    if (chart) {
        chart.destroy();
    }

    chart = new Chart(ctx, {
        type: "line",
        data: {
            labels: labels,
            datasets: [{
                label: "Pintaveden lämpötila (°C)",
                data: values,
                borderColor: "#0056b3",
                backgroundColor: "rgba(0,86,179,0.1)",
                fill: true,
                tension: 0.2,
                pointRadius: 2
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    title: {
                        display: true,
                        text: "°C"
                    }
                },
                x: {
                    title: {
                        display: true,
                        text: "Päivämäärä"
                    }
                }
            },
            plugins: {
                legend: {
                    display: true
                }
            }
        }
    });

}

// CSV-vienti

exportCSVButton.addEventListener("click", exportCSV);

function exportCSV(){

    let csv;
    let filename;

    if (comparisonMode && comparisonExportData) {

        // Vuosivertailu: yksi sarake per vuosi
        const d = comparisonExportData;

        csv = "Päivä;" + d.years.map(y => y.year).join(";") + "\n";

        for (let i = 0; i < d.labels.length; i++) {

            csv += d.labels[i];

            d.years.forEach(y => {
                csv += ";" + y.values[i];
            });

            csv += "\n";

        }

        filename = "veden_lampotilat_vuosivertailu.csv";

    }

    else {

        if(currentValues.length===0){

            alert("Ei vietävää dataa. Hae ensin lämpötiloja.");

            return;

        }

        csv="Päivämäärä;Lämpötila\n";

        for(let i=0;i<currentValues.length;i++){

            csv+=
            currentLabels[i] +
            ";" +
            currentValues[i] +
            "\n";

        }

        filename = "veden_lampotilat.csv";

    }

    const blob=
    new Blob(
        ["\ufeff" + csv],
        {
            type:"text/csv;charset=utf-8;"
        }
    );

    const url=
    URL.createObjectURL(blob);

    const a=
    document.createElement("a");

    a.href=url;

    a.download=filename;

    a.click();

    URL.revokeObjectURL(url);

}
