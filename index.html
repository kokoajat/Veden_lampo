<!DOCTYPE html>
<html lang="fi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SYKE Pintaveden lämpötilat v15</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
    background:#edf2f7;
    color:#222;
}

.container{

    max-width:1100px;
    margin:auto;

    background:#fff;

    border-radius:12px;

    box-shadow:0 5px 15px rgba(0,0,0,.15);

    padding:25px;

}

h1{

    margin-top:0;

    color:#0056b3;

    text-align:center;

}

.form-group{

    margin-bottom:15px;

}

label{

    display:block;

    margin-bottom:5px;

    font-weight:bold;

}

input,
select{

    width:100%;

    padding:10px;

    border:1px solid #ccc;

    border-radius:6px;

    font-size:15px;

}

button{

    background:#0056b3;

    color:white;

    border:none;

    padding:10px 18px;

    border-radius:6px;

    cursor:pointer;

    font-size:15px;

}

button:hover{

    background:#003f86;

}

button:disabled{

    background:#9ab4d1;

    cursor:not-allowed;

}

.row{

    display:flex;

    gap:15px;

    flex-wrap:wrap;

}

.col{

    flex:1;

    min-width:250px;

}

.toolbar{

    margin-top:20px;

    display:flex;

    gap:10px;

    flex-wrap:wrap;

}

.stats{

    margin-top:20px;

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(170px,1fr));

    gap:10px;

}

.card{

    background:#f5f8fc;

    border-radius:8px;

    padding:12px;

    text-align:center;

}

.card h3{

    margin:0;

    font-size:14px;

    color:#777;

}

.card p{

    margin:8px 0 0;

    font-size:22px;

    font-weight:bold;

    color:#0056b3;

}

#chartContainer{

    margin-top:25px;

    height:500px;

}

#error{

    color:red;

    font-weight:bold;

    margin-top:10px;

}

#loading{

    display:none;

    margin-top:10px;

    color:#0056b3;

    font-weight:bold;

}

footer{

    margin-top:30px;

    text-align:center;

    color:#888;

    font-size:13px;

}

@media(max-width:700px){

.row{

display:block;

}

.col{

margin-bottom:12px;

}

.toolbar{

display:grid;

grid-template-columns:1fr 1fr;

}

}

</style>

</head>

<body>

<div class="container">

<h1>SYKE Pintaveden lämpötilat v15</h1>

<div class="form-group">

<label>Mittausasema</label>

<div class="row">

<div class="col">

<input
id="stationSearch"
type="text"
placeholder="Kirjoita esim. Nellim">

</div>

<div style="width:130px">

<button
id="searchButton">

Etsi

</button>

</div>

</div>

</div>

<div class="form-group">

<select id="stationSelect">

<option>Kirjoita hakusana ja paina Etsi</option>

</select>

<label style="font-weight:normal;margin-top:10px;display:flex;align-items:center;gap:8px;cursor:pointer;">
<input
type="checkbox"
id="onlyTempStations"
checked
style="width:auto;margin:0;">
Näytä vain asemat, joilla mitataan pintaveden lämpötilaa
</label>

</div>

<div class="row">

<div class="col">

<label>Alkupäivä</label>

<input
type="date"
id="startDate"
value="2024-05-01">

</div>

<div class="col">

<label>Loppupäivä</label>

<input
type="date"
id="endDate">

</div>

</div>

<div class="form-group" style="margin-top:20px;border-top:1px solid #eee;padding-top:15px;">

<label>Vertaa samaa ajanjaksoa eri vuosina</label>

<p style="margin:0 0 10px;color:#666;font-size:14px;">
Käyttää yllä olevan alku- ja loppupäivän päivää ja kuukautta. Kirjoita alle vuodet joita haluat verrata.
</p>

<div class="row">

<div class="col">

<input
id="yearsInput"
type="text"
placeholder="esim. 2022,2023,2024,2025,2026">

</div>

<div style="width:170px">

<button
id="compareYearsButton">

Vertaa vuosia

</button>

</div>

</div>

</div>

<div class="toolbar">

<button id="loadButton">

Hae lämpötilat

</button>

<button id="savePNG">

Tallenna PNG

</button>

<button id="exportCSV">

Vie CSV

</button>

<button id="refresh">

Päivitä

</button>

</div>

<div id="loading">

Haetaan tietoja...

</div>

<div id="error"></div>

<div class="stats">

<div class="card">

<h3>Mittauksia</h3>

<p id="countStat">-</p>

</div>

<div class="card">

<h3>Minimi</h3>

<p id="minStat">-</p>

</div>

<div class="card">

<h3>Maksimi</h3>

<p id="maxStat">-</p>

</div>

<div class="card">

<h3>Keskiarvo</h3>

<p id="avgStat">-</p>

</div>

<div class="card">

<h3>Viimeisin</h3>

<p id="lastStat">-</p>

</div>

</div>

<div id="chartContainer">

<canvas id="tempChart"></canvas>

</div>

<div id="yearStats" style="margin-top:20px;"></div>

<footer>

Hydrologiarajapinta 1.2 • Chart.js • v15 (korjattu)

</footer>

</div>

<script>

const API_BASE =
"https://rajapinnat.ymparisto.fi/api/Hydrologiarajapinta/1.2/odata";

let chart = null;

// Nykyisen kuvaajan data talteen CSV-vientiä varten
let currentLabels = [];
let currentValues = [];

// Viimeisimmän asemahaun tulokset talteen (Paikka_Id + Nimi),
// jotta voimme kokeilla saman nimisiä "sisaraseamia" jos valitulla
// asemalla ei ole pintaveden lämpötiladataa (SYKE rekisteröi saman
// paikan usealla eri Paikka_Id:llä, yksi per mittaussuure).
let lastStationResults = [];

// Ollaanko vuosivertailu-tilassa (vaikuttaa CSV-vientiin)
let comparisonMode = false;
let comparisonExportData = null; // { labels: [...], years: [{year, values:[...]}] }

// Pintaveden lämpötilan Suure_Id haetaan rajapinnasta kerran ja
// muistetaan. Sen avulla asemahausta voidaan karsia pois asemat,
// jotka mittaavat jotain muuta suuretta (vedenkorkeus, virtaama...).
let tempSuureId = null;
let tempSuureLookupDone = false;

document.getElementById("endDate").value =
new Date().toISOString().substring(0,10);

// ------------------------------
// Elementtiviittaukset
// ------------------------------

const stationSearch = document.getElementById("stationSearch");
const stationSelect = document.getElementById("stationSelect");

const loadButton = document.getElementById("loadButton");
const searchButton = document.getElementById("searchButton");
const savePNGButton = document.getElementById("savePNG");
const refreshButton = document.getElementById("refresh");
const exportCSVButton = document.getElementById("exportCSV");
const compareYearsButton = document.getElementById("compareYearsButton");
const yearsInput = document.getElementById("yearsInput");
const onlyTempStations = document.getElementById("onlyTempStations");

const loading = document.getElementById("loading");
const error = document.getElementById("error");

// ------------------------------
// Aputoiminnot
// ------------------------------

function showLoading(text = "Haetaan tietoja...") {

    loading.style.display = "block";
    loading.textContent = text;

}

function hideLoading() {

    loading.style.display = "none";

}

function showError(msg) {

    error.textContent = msg;

}

function clearError() {

    error.textContent = "";

}

// ------------------------------
// Asemien haku
// ------------------------------

// Hakee Suure-taulun ja etsii sieltä sen suureen, jonka data löytyy
// LampoPintavesi-taulusta. Taulu on pieni (~15 riviä), joten se haetaan
// kokonaan ja suodatetaan selaimessa - näin vältetään OData-filtterin
// kenttänimien arvailu. Tulos muistetaan istunnon ajaksi.
async function getTempSuureId() {

    if (tempSuureLookupDone) {
        return tempSuureId;
    }

    tempSuureLookupDone = true;

    try {

        const url = `${API_BASE}/Suure`;

        console.log(url);

        const response = await fetch(url, {
            headers: { "Accept": "application/json" }
        });

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const json = await response.json();

        const match = json.value.find(s =>
            s.DatataulunNimi === "LampoPintavesi" ||
            s.taulunnimi === "LampoPintavesi"
        );

        if (match) {
            tempSuureId = match.Suure_Id;
            console.log("Pintaveden lämpötilan Suure_Id:", tempSuureId, match.Nimi);
        } else {
            console.warn("Suure-taulusta ei löytynyt LampoPintavesi-riviä.");
        }

    }

    catch (err) {
        console.warn("Suure_Id:n haku epäonnistui, suodatus ohitetaan:", err.message);
    }

    return tempSuureId;

}

async function searchStations() {

    clearError();

    const term = stationSearch.value.trim();

    if (term.length < 2) {

        showError("Kirjoita vähintään kaksi kirjainta.");

        return;

    }

    showLoading("Haetaan asemia...");
    searchButton.disabled = true;

    try {

        // Selvitä lämpötilasuureen tunnus, jos suodatus on päällä
        let suureId = null;

        if (onlyTempStations.checked) {
            suureId = await getTempSuureId();
        }

        const params = new URLSearchParams();

        // Huom: haku pienillä kirjaimilla, jotta täsmää tolower(Nimi):iin
        let filter =
            `substringof('${term.toLowerCase()}',tolower(Nimi))`;

        if (suureId !== null) {
            filter += ` and Suure_Id eq ${suureId}`;
        }

        params.set("$filter", filter);

        params.set("$orderby","Nimi");

        const url =
            `${API_BASE}/Paikka?${params.toString()}`;

        console.log(url);

        const response = await fetch(url,{
            headers:{
                "Accept":"application/json"
            }
        });

        if(!response.ok){

            throw new Error(
                "HTTP "+response.status
            );

        }

        const json = await response.json();

        stationSelect.innerHTML = "";
        lastStationResults = [];

        if(json.value.length===0){

            stationSelect.innerHTML =
            "<option>Ei asemia</option>";

            if (onlyTempStations.checked) {
                showError(
                    `Hakusanalla "${term}" ei löytynyt lämpötila-asemia. Poista rasti ruudusta nähdäksesi kaikki asemat.`
                );
            } else {
                showError(`Hakusanalla "${term}" ei löytynyt asemia.`);
            }

            hideLoading();
            searchButton.disabled = false;

            return;

        }

        json.value.forEach(station=>{

            const option =
            document.createElement("option");

            option.value =
            station.Paikka_Id;

            option.textContent =
            `${station.Nimi} (${station.Paikka_Id})`;

            stationSelect.appendChild(option);

            lastStationResults.push({
                Paikka_Id: station.Paikka_Id,
                Nimi: station.Nimi
            });

        });

        // Jos suodatus oli päällä mutta Suure_Id:tä ei saatu haettua,
        // kerro ettei karsintaa voitu tehdä.
        if (onlyTempStations.checked && suureId === null) {
            showError(
                "Huom: lämpötila-asemien tunnistus epäonnistui, joten listassa voi olla myös muita mittausasemia."
            );
        }

    }

    catch(err){

        showError("Asemien haku epäonnistui: " + err.message);

    }

    hideLoading();
    searchButton.disabled = false;

}

// Haetaan asemat uudelleen kun suodatusvalinta muuttuu
onlyTempStations.addEventListener("change", () => {
    if (stationSearch.value.trim().length >= 2) {
        searchStations();
    }
});

searchButton.addEventListener("click", searchStations);

// Mahdollistaa haun myös Enter-näppäimellä
stationSearch.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        e.preventDefault();
        searchStations();
    }
});

// ------------------------------
// Lämpötilojen haku
// ------------------------------

loadButton.addEventListener("click", loadTemperatures);
refreshButton.addEventListener("click", loadTemperatures);

// Palauttaa listan kokeiltavista Paikka_Id:istä: ensin annettu asema,
// sitten muut samannimiset "sisaraseamat" viimeisimmästä hakutuloksesta.
function getStationCandidates(paikkaId) {

    const candidates = [paikkaId];

    const selectedStation =
        lastStationResults.find(s => String(s.Paikka_Id) === String(paikkaId));

    if (selectedStation) {

        lastStationResults.forEach(s => {
            if (s.Nimi === selectedStation.Nimi && String(s.Paikka_Id) !== String(paikkaId)) {
                candidates.push(s.Paikka_Id);
            }
        });

    }

    return candidates;

}

// Hakee LampoPintavesi-datan yhdelle Paikka_Id:lle.
// Palauttaa {labels, values, rawDates} tai null, jos mittauksia ei löytynyt.
// Heittää virheen vain HTTP-tason ongelmista (esim. verkkovirhe).
async function fetchTemperatureData(paikkaId, start, end) {

    const params = new URLSearchParams();

    params.set(
        "$filter",
        `Paikka_Id eq ${paikkaId} and Aika ge datetime'${start}T00:00:00' and Aika le datetime'${end}T23:59:59'`
    );

    params.set("$orderby","Aika asc");

    const url =
        `${API_BASE}/LampoPintavesi?${params.toString()}`;

    console.log(url);

    const response = await fetch(url,{
        headers:{
            "Accept":"application/json"
        }
    });

    if(!response.ok){
        throw new Error("HTTP " + response.status);
    }

    const json = await response.json();

    if(!json.value.length){
        return null;
    }

    const labels = [];
    const values = [];
    const rawDates = [];

    json.value.forEach(r=>{

        const d = new Date(r.Aika);

        rawDates.push(d);

        labels.push(
            d.toLocaleDateString("fi-FI")
        );

        values.push(
            Number(r.Arvo)
        );

    });

    return { labels, values, rawDates };

}

// Kokeilee annetun aseman ja sen sisaraseamien dataa annetulla
// aikavälillä, kunnes joltain löytyy mittauksia.
// Palauttaa {result, usedPaikkaId} tai null jos yhdeltäkään ei löytynyt.
async function fetchWithFallback(paikkaId, start, end, onTrySibling) {

    const candidates = getStationCandidates(paikkaId);

    for (const candidate of candidates) {

        if (String(candidate) !== String(paikkaId) && onTrySibling) {
            onTrySibling(candidate);
        }

        const result = await fetchTemperatureData(candidate, start, end);

        if (result) {
            return { result, usedPaikkaId: candidate };
        }

    }

    return null;

}

async function loadTemperatures() {

    clearError();

    const paikkaId = stationSelect.value;

    if (!paikkaId || isNaN(Number(paikkaId))) {
        showError("Valitse ensin asema hakutuloksista.");
        return;
    }

    showLoading("Haetaan lämpötiloja...");
    loadButton.disabled = true;
    comparisonMode = false;
    document.getElementById("yearStats").innerHTML = "";

    try {

        const start =
            document.getElementById("startDate").value;

        const end =
            document.getElementById("endDate").value;

        if (!start || !end) {
            throw new Error("Valitse alku- ja loppupäivä.");
        }

        const found = await fetchWithFallback(paikkaId, start, end, (candidate) => {
            showLoading(`Kokeillaan asemaa Paikka_Id ${candidate}...`);
        });

        if (!found) {
            throw new Error(
                "Mittauksia ei löytynyt valitulla aikavälillä yhdeltäkään samannimiseltä asemalta."
            );
        }

        const { result, usedPaikkaId } = found;

        // Jos päädyttiin toiseen asemaan kuin valikossa oli valittuna,
        // päivitä valikko ja kerro käyttäjälle mitä tehtiin.
        if (String(usedPaikkaId) !== String(paikkaId)) {
            stationSelect.value = usedPaikkaId;
            showError(
                `Huom: valitulla asemalla ei ollut lämpötiladataa. Näytetään tiedot asemalta Paikka_Id ${usedPaikkaId}.`
            );
        }

        // Talteen CSV-vientiä varten
        currentLabels = result.labels;
        currentValues = result.values;

        updateStatistics(result.values);

        drawChart(result.labels, result.values);

    }

    catch(err){

        showError(err.message);

    }

    hideLoading();
    loadButton.disabled = false;

}

// ----------------------------------------------------
// Vuosivertailu
// ----------------------------------------------------

compareYearsButton.addEventListener("click", compareYears);

yearsInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        e.preventDefault();
        compareYears();
    }
});

// Värit eri vuosille (kierrätetään jos vuosia on enemmän)
const YEAR_COLORS = [
    "#0056b3",
    "#e6194b",
    "#3cb44b",
    "#f58231",
    "#911eb4",
    "#008080",
    "#9a6324",
    "#000075"
];

// Tulkitsee vuosikentän: "22,23,24" tai "2022, 2023" tai "2022-2026"
function parseYears(text) {

    const years = [];

    text.split(/[,;\s]+/).forEach(part => {

        part = part.trim();

        if (!part) return;

        // Väli, esim. 2022-2026 tai 22-26
        const range = part.match(/^(\d{2,4})\s*[-–]\s*(\d{2,4})$/);

        if (range) {

            const from = normalizeYear(range[1]);
            const to = normalizeYear(range[2]);

            if (from !== null && to !== null && from <= to) {
                for (let y = from; y <= to; y++) {
                    years.push(y);
                }
            }

            return;

        }

        const y = normalizeYear(part);

        if (y !== null) {
            years.push(y);
        }

    });

    // Poista duplikaatit, järjestä nousevaan järjestykseen
    return [...new Set(years)].sort((a,b)=>a-b);

}

// "22" -> 2022, "2024" -> 2024
function normalizeYear(text) {

    if (!/^\d{2,4}$/.test(text)) return null;

    let y = parseInt(text, 10);

    if (text.length === 2) {
        y = 2000 + y;
    }

    if (y < 1900 || y > 2100) return null;

    return y;

}

// Palauttaa "MM-DD" annetusta yyyy-mm-dd -merkkijonosta
function monthDay(dateString) {
    return dateString.substring(5);
}

async function compareYears() {

    clearError();
    document.getElementById("yearStats").innerHTML = "";

    const paikkaId = stationSelect.value;

    if (!paikkaId || isNaN(Number(paikkaId))) {
        showError("Valitse ensin asema hakutuloksista.");
        return;
    }

    const years = parseYears(yearsInput.value);

    if (years.length === 0) {
        showError("Anna vertailtavat vuodet, esim. 2022,2023,2024,2025,2026");
        return;
    }

    const start = document.getElementById("startDate").value;
    const end = document.getElementById("endDate").value;

    if (!start || !end) {
        showError("Valitse alku- ja loppupäivä (päivä ja kuukausi otetaan näistä).");
        return;
    }

    const startMD = monthDay(start);
    const endMD = monthDay(end);

    if (startMD > endMD) {
        showError("Vuosivertailu ei tue vuodenvaihteen yli menevää jaksoa. Aseta loppupäivä samalle kalenterivuodelle kuin alkupäivä.");
        return;
    }

    compareYearsButton.disabled = true;
    loadButton.disabled = true;

    const yearData = [];
    const missingYears = [];

    try {

        for (const year of years) {

            showLoading(`Haetaan vuotta ${year}...`);

            const yStart = `${year}-${startMD}`;
            const yEnd = `${year}-${endMD}`;

            const found = await fetchWithFallback(paikkaId, yStart, yEnd);

            if (found) {

                yearData.push({
                    year: year,
                    result: found.result,
                    usedPaikkaId: found.usedPaikkaId
                });

            } else {
                missingYears.push(year);
            }

        }

        if (yearData.length === 0) {
            throw new Error(
                `Mittauksia ei löytynyt yhdeltäkään vuodelta (${years.join(", ")}) tällä ajanjaksolla.`
            );
        }

        drawComparisonChart(yearData, startMD, endMD);
        renderYearStats(yearData);

        comparisonMode = true;

        if (missingYears.length > 0) {
            showError(
                `Huom: vuosilta ${missingYears.join(", ")} ei löytynyt mittauksia tällä ajanjaksolla.`
            );
        }

    }

    catch (err) {
        showError(err.message);
    }

    hideLoading();
    compareYearsButton.disabled = false;
    loadButton.disabled = false;

}

// Piirtää usean vuoden käyrät samaan kaavioon.
// X-akselina käytetään päivä.kuukausi -muotoa, jotta vuodet
// asettuvat päällekkäin vertailtaviksi.
function drawComparisonChart(yearData, startMD, endMD) {

    // Rakennetaan yhteinen x-akseli: kaikki jaksolla esiintyvät MM-DD
    const allMD = new Set();

    yearData.forEach(yd => {
        yd.result.rawDates.forEach(d => {
            const mm = String(d.getMonth()+1).padStart(2,"0");
            const dd = String(d.getDate()).padStart(2,"0");
            allMD.add(`${mm}-${dd}`);
        });
    });

    const sortedMD = [...allMD].sort();

    const labels = sortedMD.map(md => {
        const [mm, dd] = md.split("-");
        return `${dd}.${mm}.`;
    });

    const datasets = yearData.map((yd, i) => {

        // Kartta MM-DD -> arvo tälle vuodelle
        const byMD = {};

        yd.result.rawDates.forEach((d, idx) => {
            const mm = String(d.getMonth()+1).padStart(2,"0");
            const dd = String(d.getDate()).padStart(2,"0");
            byMD[`${mm}-${dd}`] = yd.result.values[idx];
        });

        const color = YEAR_COLORS[i % YEAR_COLORS.length];

        return {
            label: String(yd.year),
            data: sortedMD.map(md => md in byMD ? byMD[md] : null),
            borderColor: color,
            backgroundColor: color,
            fill: false,
            tension: 0.2,
            pointRadius: 1.5,
            spanGaps: true
        };

    });

    const ctx = document.getElementById("tempChart").getContext("2d");

    if (chart) {
        chart.destroy();
    }

    chart = new Chart(ctx, {
        type: "line",
        data: {
            labels: labels,
            datasets: datasets
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: {
                mode: "index",
                intersect: false
            },
            scales: {
                y: {
                    title: { display: true, text: "°C" }
                },
                x: {
                    title: { display: true, text: "Päivä" },
                    ticks: { maxTicksLimit: 15 }
                }
            },
            plugins: {
                legend: { display: true },
                title: {
                    display: true,
                    text: `Vuosivertailu ${startMD.replace("-",".")} – ${endMD.replace("-",".")}`
                }
            }
        }
    });

    // Talteen CSV-vientiä varten
    comparisonExportData = {
        labels: labels,
        years: yearData.map(yd => {

            const byMD = {};

            yd.result.rawDates.forEach((d, idx) => {
                const mm = String(d.getMonth()+1).padStart(2,"0");
                const dd = String(d.getDate()).padStart(2,"0");
                byMD[`${mm}-${dd}`] = yd.result.values[idx];
            });

            return {
                year: yd.year,
                values: sortedMD.map(md => md in byMD ? byMD[md] : "")
            };

        })
    };

    // Nollaa yhden vuoden tilastokortit, koska ne eivät päde vertailuun
    ["countStat","minStat","maxStat","avgStat","lastStat"].forEach(id => {
        document.getElementById(id).textContent = "-";
    });

}

// Näyttää taulukon, jossa jokaisen vuoden tunnusluvut rinnakkain
function renderYearStats(yearData) {

    let html = `
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <thead>
        <tr style="background:#f5f8fc;">
          <th style="padding:8px;text-align:left;border-bottom:2px solid #ddd;">Vuosi</th>
          <th style="padding:8px;text-align:right;border-bottom:2px solid #ddd;">Mittauksia</th>
          <th style="padding:8px;text-align:right;border-bottom:2px solid #ddd;">Min</th>
          <th style="padding:8px;text-align:right;border-bottom:2px solid #ddd;">Max</th>
          <th style="padding:8px;text-align:right;border-bottom:2px solid #ddd;">Keskiarvo</th>
        </tr>
      </thead>
      <tbody>`;

    yearData.forEach((yd, i) => {

        const v = yd.result.values;
        const avg = v.reduce((a,b)=>a+b,0) / v.length;
        const color = YEAR_COLORS[i % YEAR_COLORS.length];

        html += `
        <tr>
          <td style="padding:8px;border-bottom:1px solid #eee;">
            <span style="display:inline-block;width:12px;height:12px;background:${color};border-radius:2px;margin-right:8px;"></span>
            <strong>${yd.year}</strong>
          </td>
          <td style="padding:8px;text-align:right;border-bottom:1px solid #eee;">${v.length}</td>
          <td style="padding:8px;text-align:right;border-bottom:1px solid #eee;">${Math.min(...v).toFixed(1)} °C</td>
          <td style="padding:8px;text-align:right;border-bottom:1px solid #eee;">${Math.max(...v).toFixed(1)} °C</td>
          <td style="padding:8px;text-align:right;border-bottom:1px solid #eee;"><strong>${avg.toFixed(1)} °C</strong></td>
        </tr>`;

    });

    html += `</tbody></table>`;

    document.getElementById("yearStats").innerHTML = html;

}

// ----------------------------------------------------
// Tilastojen laskenta
// ----------------------------------------------------

function updateStatistics(values) {

    if (!values || values.length === 0) return;

    const count = values.length;

    const min = Math.min(...values);

    const max = Math.max(...values);

    const avg =
        values.reduce((a,b)=>a+b,0) / count;

    const sorted =
        [...values].sort((a,b)=>a-b);

    const median =
        sorted.length % 2 === 0
        ?
        (
            sorted[sorted.length/2-1]
            +
            sorted[sorted.length/2]
        ) / 2
        :
        sorted[Math.floor(sorted.length/2)];

    document.getElementById("countStat").textContent =
        count;

    document.getElementById("minStat").textContent =
        min.toFixed(1) + " °C";

    document.getElementById("maxStat").textContent =
        max.toFixed(1) + " °C";

    document.getElementById("avgStat").textContent =
        avg.toFixed(1) + " °C";

    document.getElementById("lastStat").textContent =
        values[values.length-1].toFixed(1) + " °C";

    console.log({
        count,
        min,
        max,
        avg,
        median
    });

}

// Kaavion piirto

function drawChart(labels, values) {

    const ctx = document.getElementById("tempChart").getContext("2d");

    if (chart) {
        chart.destroy();
    }

    chart = new Chart(ctx, {
        type: "line",
        data: {
            labels: labels,
            datasets: [{
                label: "Pintaveden lämpötila (°C)",
                data: values,
                borderColor: "#0056b3",
                backgroundColor: "rgba(0,86,179,0.1)",
                fill: true,
                tension: 0.2,
                pointRadius: 2
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    title: {
                        display: true,
                        text: "°C"
                    }
                },
                x: {
                    title: {
                        display: true,
                        text: "Päivämäärä"
                    }
                }
            },
            plugins: {
                legend: {
                    display: true
                }
            }
        }
    });

}

// CSV-vienti
// ----------------------------------------------------

exportCSVButton.addEventListener("click", exportCSV);

function exportCSV(){

    let csv;
    let filename;

    if (comparisonMode && comparisonExportData) {

        // Vuosivertailu: yksi sarake per vuosi
        const d = comparisonExportData;

        csv = "Päivä;" + d.years.map(y => y.year).join(";") + "\n";

        for (let i = 0; i < d.labels.length; i++) {

            csv += d.labels[i];

            d.years.forEach(y => {
                csv += ";" + y.values[i];
            });

            csv += "\n";

        }

        filename = "veden_lampotilat_vuosivertailu.csv";

    }

    else {

        if(currentValues.length===0){

            alert("Ei vietävää dataa. Hae ensin lämpötiloja.");

            return;

        }

        csv="Päivämäärä;Lämpötila\n";

        for(let i=0;i<currentValues.length;i++){

            csv+=
            currentLabels[i] +
            ";" +
            currentValues[i] +
            "\n";

        }

        filename = "veden_lampotilat.csv";

    }

    const blob=
    new Blob(
        ["\ufeff" + csv],
        {
            type:"text/csv;charset=utf-8;"
        }
    );

    const url=
    URL.createObjectURL(blob);

    const a=
    document.createElement("a");

    a.href=url;

    a.download=filename;

    a.click();

    URL.revokeObjectURL(url);

}
